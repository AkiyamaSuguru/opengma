[project]
name = "opengma"
version = "0.1.0"
description = "Open General Material Analyzer: read, analyze and plot materials characterization data (XPS, Raman, XRD)."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.5",
    "flet-charts>=1.0.5",
    "h5netcdf[h5py]>=1.8.2",
    "matplotlib>=3.11.2",
    "numpy>=2.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "python-calamine>=0.9.0",
    "xarray>=2026.9.0",
]

# 安装后在终端输入 opengma 启动图形界面（也可以 python -m GMA.UI）
[project.scripts]
opengma = "GMA.UI:run"

# 让 uv sync 把 src/GMA 以可编辑模式装进环境，这样在任何位置都能 import GMA
[build-system]
requires = ["uv_build>=0.11.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "GMA"

[tool.pytest.ini_options]
testpaths = ["tests"]
# marimo 依赖的 anyio 自带 pytest 插件，本项目用不到，关掉以免输出无关的弃用提示
addopts = ["-p", "no:anyio"]
# flet[test] 带的 pytest-asyncio 要求写明异步夹具的事件循环范围；本项目的测试不用异步夹具
asyncio_default_fixture_loop_scope = "function"
# pandas 提示以后读取 .xlsx 的默认引擎会从 openpyxl 改为 calamine；两者都在依赖中，与测试无关
filterwarnings = ["ignore:The default engine for reading 'xlsx' files:DeprecationWarning"]

[dependency-groups]
# marimo 笔记本：uv sync 默认安装（见 [tool.uv]）；不在 [project] 的依赖中，所以不会打包进图形界面程序
notebook = [
    "marimo>=0.23.16",
]
dev = [
    "flet-cli>=1.0.5",
    "flet-desktop>=1.0.5",
    "flet-web>=1.0.5",
    "flet[test]>=1.0.5",
    "pytest>=9.2.0",
]

[tool.uv]
default-groups = ["dev", "notebook"]

# ============================================================
# 打包图形界面（flet build）：uv run python scripts/build_app.py build <macos|windows|linux>
# 程序带着自己的 Python（版本按上面的 requires-python 选），依赖取自 [project] 的 dependencies
# ============================================================
[tool.flet]
product = "OpenGMA"            # 窗口、启动台、关于对话框中显示的名称
artifact = "OpenGMA"           # 程序文件名：OpenGMA.app、OpenGMA.exe、OpenGMA
org = "io.github.akiyamasuguru"
company = "Jay Ma"
copyright = "Copyright © 2026 Jay Ma. Licensed under AGPL-3.0-only."

[tool.flet.app]
path = "src"                   # 打包 src 文件夹：入口 src/main.py 和 GMA 包
module = "main"

[tool.flet.linux]
categories = ["Science", "Education"]
