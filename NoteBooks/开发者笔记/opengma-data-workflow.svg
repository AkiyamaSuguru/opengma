<title id="t">从原始数据到科学结论：数据准备、分析与可视化流程</title>
<desc id="d">实验、模拟与元数据经载入、清理、改写成为干净的结构化数据；随后在理论驱动与探索驱动下于分析和可视化之间迭代，最后经解释与交流形成可信的科学结论。据 Scopatz 与 Huff《Python物理学高效计算》图 7-1 重绘并改编。</desc>
